<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Collaborative Beat Maker</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<main class="card">
	<header class="card-header">
		<h1>Collaborative Beat Maker</h1>
		<p class="subtitle">Create rhythms together in realtime</p>
	</header>

	<section class="card-body">
		<div id="column-markers" class="column-markers" aria-hidden="true"></div>
		<div id="beat-grid" class="grid-area"></div>

		<div id="controls" class="controls">
			<div class="left">
				<button id="play" class="btn">Play</button>
				<button id="stop" class="btn btn-ghost">Stop</button>
			</div>
			<div class="right">
				<label class="tempo">Tempo: <input id="tempo" type="number" value="120" min="40" max="300"> BPM</label>
			</div>
		</div>

		<div id="legend" class="legend">Rows: 1 (high) → 4 (low)</div>
	</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="app.js"></script>
</body>
</html>
